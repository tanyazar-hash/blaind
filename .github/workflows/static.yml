name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build root deployment for unit tests
        run: npm run build
      - name: Unit and database tests
        run: npm test
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Keyboard, motion, WebGL recovery and admin regression checks
        run: node tests/polish-browser.cjs
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
      - name: Accessibility regression checks
        run: npm run test:accessibility
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build for the actual Pages base path
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          STATIC_HOSTING: '1'
          HOSTED_ADMIN_URL: https://blaind-tanyazar-hashs-projects.vercel.app/admin/
      - name: Test the built site using a plain static server
        run: node tests/hosting-browser.cjs
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          STATIC_HOSTING: '1'
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the published Pages site (read-only)
        run: node tests/deployed-browser.cjs
        env:
          DEPLOY_TARGET: pages
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          VERCEL_URL: https://blaind-tanyazar-hashs-projects.vercel.app/
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
      - name: Verify the public Vercel site and protected application login (read-only)
        run: node tests/deployed-browser.cjs
        env:
          DEPLOY_TARGET: vercel
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          VERCEL_URL: https://blaind-tanyazar-hashs-projects.vercel.app/
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
